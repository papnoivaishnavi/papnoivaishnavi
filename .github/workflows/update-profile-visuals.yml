name: Update profile visuals

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-profile-visuals.yml
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Create profile asset directory
        run: mkdir -p profile

      - name: Generate animated contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/contribution-snake.svg?color_snake=%23B96A99&color_dots=%23FFF0F5,%23F4CEE0,%23E6A6C6,%23D17EA9,%23AE648D
            profile/contribution-snake-dark.svg?palette=github-dark&color_snake=%23F2A7C4&color_dots=%231A1B27,%23473850,%2375526D,%23B96A99,%23F2A7C4

      - name: Generate GitHub statistics card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&bg_color=FFF8FB&title_color=493B50&text_color=675D6A&icon_color=C86FA1&border_color=F1DDE8&hide_border=true
          path: profile/stats.svg
          token: ${{ github.token }}

      - name: Generate language card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&custom_title=Code%20Languages&layout=compact&langs_count=5&hide_progress=true&bg_color=FFF8FB&title_color=493B50&text_color=675D6A&icon_color=C86FA1&border_color=F1DDE8&hide_border=true
          path: profile/top-langs.svg
          token: ${{ github.token }}

      - name: Commit refreshed profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/contribution-snake.svg profile/contribution-snake-dark.svg profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "No profile asset changes."
            exit 0
          fi
          git commit -m "chore: refresh profile visuals"
          git push
